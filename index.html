<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(90%, 380px);
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px #0f172a1a;
        }

        #heading {
            margin: 0 0 24px;
            text-align: center;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        .error {
            display: block;
            min-height: 1.2em;
            margin-top: 4px;
            color: #b91c1c;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 1.2em;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="heading">Login Form</h2>
        <form id="login-form" action="#" method="post" novalidate>
            <div id="form-email">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter Email" autocomplete="email" required>
                <span id="emailError" class="error" aria-live="polite"></span>
            </div>

            <div id="form-password">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password"
                    autocomplete="current-password" required>
                <span id="passwordError" class="error" aria-live="polite"></span>
            </div>

            <button type="submit" id="btn-submit">Login</button>
            <span id="message" role="status" aria-live="polite"></span>
        </form>

    </div>
    <script>
        const form = document.getElementById('login-form');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const message = document.getElementById("message");
            emailError.innerText = "";
            passwordError.innerText = "";
            message.innerText = "";

            if(email === ""){
                emailError.innerText = "Email is required"
                return;
            }
            if(password === ""){
                passwordError.innerText = "Password is required"
                return;
            }

            const correctEmail = "abc@gmail.com";
            const correctPassword = "12345";
            
            if(email === correctEmail && password === correctPassword){
                message.innerText = "Login Successfully"
            }
            else{
                message.innerText = "Invalid Email or Password";
                message.style.color = "red";
            }
        });


        const myPromise = new Promise((resolve, reject) => {
            let age = 5;
            if(age > 18){
                resolve("Eligible")
            }
            else{
                reject("Not eligible")
            }
        })

        myPromise.then((message) => console.log(message)).catch((error) => console.error(error))
    </script>
</body>

</html>
